name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test core and media
        run: cargo test -p spotify-overlay-core -p spotify-overlay-media

  macos:
    name: app (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Test
        run: cargo test --workspace

  windows:
    name: app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Test
        run: cargo test --workspace
