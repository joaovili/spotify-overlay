name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: core (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - name: Test core
        run: cargo test -p spotify-overlay-core

  macos:
    name: app (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: npm ci
      - name: Test
        run: cargo test -p spotify-overlay-core -p spotify-overlay-media
      - name: Check app
        run: cargo check -p spotify-overlay

  windows:
    name: app (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: npm ci
      - name: Test
        run: cargo test -p spotify-overlay-core -p spotify-overlay-media
      - name: Check app
        run: cargo check -p spotify-overlay
