name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: macos universal
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: npm ci
      - name: Build universal app
        run: npm run build -- --target universal-apple-darwin --bundles app
      - name: Package
        run: |
          ditto -c -k --keepParent "target/universal-apple-darwin/release/bundle/macos/Spotify Overlay.app" SpotifyOverlay-macOS.zip
          shasum -a 256 SpotifyOverlay-macOS.zip | awk '{print $1}' > SpotifyOverlay-macOS.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            SpotifyOverlay-macOS.zip
            SpotifyOverlay-macOS.zip.sha256

  windows:
    name: windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
      - run: npm ci
      - name: Build portable exe
        run: npm run build -- --no-bundle
      - name: Package
        shell: pwsh
        run: |
          $exe = "target\release\spotify-overlay.exe"
          if (-not (Test-Path $exe)) { throw "exe nao encontrado" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe .\SpotifyOverlay.exe
          (Get-FileHash .\SpotifyOverlay.exe -Algorithm SHA256).Hash.ToLower() | Out-File .\SpotifyOverlay.exe.sha256 -Encoding ascii -NoNewline
          Compress-Archive -Path .\SpotifyOverlay.exe -DestinationPath .\SpotifyOverlay.zip -Force
          (Get-FileHash .\SpotifyOverlay.zip -Algorithm SHA256).Hash.ToLower() | Out-File .\SpotifyOverlay.zip.sha256 -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            SpotifyOverlay.exe
            SpotifyOverlay.exe.sha256
            SpotifyOverlay.zip
            SpotifyOverlay.zip.sha256

  publish:
    name: publish
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Spotify Overlay ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/SpotifyOverlay-macOS.zip
            artifacts/SpotifyOverlay-macOS.zip.sha256
            artifacts/SpotifyOverlay.exe
            artifacts/SpotifyOverlay.exe.sha256
            artifacts/SpotifyOverlay.zip
            artifacts/SpotifyOverlay.zip.sha256
