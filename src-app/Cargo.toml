[package]
name = "spotify-overlay-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "spotify-overlay"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
winit = "0.30"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
tray-icon = "0.26"
muda = "0.21"
global-hotkey = "0.8"
auto-launch = "0.6"
single-instance = "0.3"
serde.workspace = true
serde_json.workspace = true
spotify-overlay-core.workspace = true
spotify-overlay-media.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ureq = "2.12"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSPanel",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSObject", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1"
