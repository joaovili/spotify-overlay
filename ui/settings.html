<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify Overlay</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Spotify Overlay</h1>
        <p>Controle o player sem tirar o foco do app em uso.</p>
      </header>

      <section>
        <h2>Aparencia</h2>
        <label class="row">
          <span>Tamanho</span>
          <select id="size">
            <option value="mini">Mini</option>
            <option value="medium">Medio</option>
            <option value="large">Grande</option>
          </select>
        </label>
        <label class="row">
          <span>Posicao</span>
          <select id="position">
            <option value="top-right">Superior direita</option>
            <option value="top-left">Superior esquerda</option>
            <option value="bottom-right">Inferior direita</option>
            <option value="bottom-left">Inferior esquerda</option>
            <option value="custom">Personalizada</option>
          </select>
        </label>
        <div class="row custom-position" id="custom-position">
          <span>Coordenadas</span>
          <div class="pair">
            <input id="customX" type="number" step="1" aria-label="X" />
            <input id="customY" type="number" step="1" aria-label="Y" />
          </div>
        </div>
        <label class="row">
          <span>Player</span>
          <select id="player">
            <option value="auto">Automatico</option>
            <option value="spotify">Spotify</option>
            <option value="spotifast">Spotifast</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Atalhos globais</h2>
        <div class="hotkey" data-key="hotkeySkip">
          <span>Proxima faixa</span>
          <input type="text" readonly />
          <button type="button" class="record">Gravar</button>
          <button type="button" class="clear" title="Desativar">Limpar</button>
        </div>
        <div class="hotkey" data-key="hotkeyPrev">
          <span>Faixa anterior</span>
          <input type="text" readonly />
          <button type="button" class="record">Gravar</button>
          <button type="button" class="clear" title="Desativar">Limpar</button>
        </div>
        <div class="hotkey" data-key="hotkeyToggle">
          <span>Mostrar/ocultar</span>
          <input type="text" readonly />
          <button type="button" class="record">Gravar</button>
          <button type="button" class="clear" title="Desativar">Limpar</button>
        </div>
        <p class="hint">Clique em Gravar e pressione a combinacao. Esc cancela.</p>
      </section>

      <section>
        <h2>Comportamento</h2>
        <label class="check"><input id="alwaysOnTop" type="checkbox" /><span>Sempre no topo</span></label>
        <label class="check"><input id="closeHidesToTray" type="checkbox" /><span>O botao fechar esconde para a bandeja</span></label>
        <label class="check"><input id="startWithWindows" type="checkbox" /><span id="startup-label">Iniciar com o sistema</span></label>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>

    <footer>
      <button type="button" id="cancel" class="secondary">Cancelar</button>
      <button type="button" id="save" class="primary">Salvar</button>
    </footer>

    <script src="settings.js"></script>
  </body>
</html>
